:root{
  --bg:#f6f8f5; --panel:#ffffff; --fg:#17231b; --muted:#5f6d64; --line:#e2e8e1;
  --brand:#2e7a30; --brand-ink:#ffffff; --brand-soft:#e8f5e6;
  --green:#4ab842; --mint:#53dda5; --mint-soft:#e4f9f0; --blue:#0981e4; --blue-soft:#e7f2fd; --orange:#f3b328; --orange-soft:#fef5de;
  --accent:#c7314e; --accent-soft:#fbe9ed;
  --ok:#2e7a30; --warn:#8f5d00; --warn-soft:#fef5de; --bad:#b3261e; --bad-soft:#fde7e5;
  --radius:16px; --shadow:0 1px 2px rgba(23,35,27,.05),0 6px 18px rgba(46,122,48,.07);
  --stripe:linear-gradient(90deg,var(--green) 0 26%,var(--blue) 26% 46%,var(--orange) 46% 70%,var(--mint) 70% 84%,var(--accent) 84% 100%);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1511; --panel:#18211b; --fg:#e7efe8; --muted:#9caaa0; --line:#2a352d;
  --brand:#5cc95a; --brand-ink:#08200a; --brand-soft:#173019;
  --mint-soft:#12302a; --blue:#5aa9f0; --blue-soft:#13263a; --orange-soft:#33280f;
  --accent:#ff6f88; --accent-soft:#3a1a21;
  --ok:#6fd47a; --warn:#f3b328; --warn-soft:#33280f; --bad:#ff8a80; --bad-soft:#3a1714;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:Kufi,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);color:var(--fg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 1px 0 var(--line)}
header.top::after{content:"";position:absolute;inset-inline:0;bottom:-4px;height:4px;background:var(--stripe)}
.brandbox{display:flex;align-items:center;gap:10px}
.brandbox .logo{width:46px;height:46px;flex:none;border-radius:12px;background:#fff;object-fit:contain;border:1px solid var(--line)}
.brandbox .sub{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.3}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.hero .logo{width:72px;height:72px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);object-fit:contain}
.card h2.acc::after{content:"";display:block;width:28px;height:3px;border-radius:2px;background:var(--accent);margin-top:6px}
header.top h1{margin:0;font-size:18px;font-weight:700;line-height:1.25;color:var(--brand)}
header.top .who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.off{background:var(--orange)}
main{max-width:640px;margin:0 auto;padding:20px 14px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 6px;font-weight:700}
.card h3{font-size:14px;margin:0 0 6px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 10px;min-height:52px;font-weight:700;cursor:pointer;text-align:center}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);min-height:64px;font-size:17px}
.btn.soft{background:var(--mint-soft);border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--mint-soft);color:var(--brand)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.demo{background:var(--line);color:var(--muted)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.jid{font-weight:700;letter-spacing:.5px}
.state{font-size:15px;font-weight:700;color:var(--brand)}
.alert{border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13.5px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.ai{border:1px dashed var(--blue);background:var(--blue-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.ai b{color:var(--blue)}
.ai b.r{color:var(--accent)}
.timeline{list-style:none;margin:8px 0 0;padding:0;border-inline-start:2px solid var(--line)}
.timeline li{position:relative;padding:4px 14px 8px 0;font-size:13.5px}
.timeline li::before{content:"";position:absolute;inset-inline-start:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--panel)}
.timeline li:first-child::before{background:var(--accent)}
.timeline li .t{color:var(--muted);font-size:12px;margin-inline-end:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:12px;padding:10px 12px}
.kpi:nth-child(5n+2){border-top-color:var(--blue)} .kpi:nth-child(5n+3){border-top-color:var(--orange)} .kpi:nth-child(5n+4){border-top-color:var(--accent)} .kpi:nth-child(5n+5){border-top-color:var(--mint)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:700;line-height:1.3}
.kpi .u{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:6px 4px}
td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
td.over{color:var(--bad);font-weight:700}
.list .item{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button{position:relative}
nav.tabs button.on{color:var(--brand)}
nav.tabs button.on::before{content:"";position:absolute;top:0;inset-inline:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:17px}
.scanner{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
.scanner .vwrap{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scanner video{width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;width:min(70vw,300px);aspect-ratio:1;border:3px solid #53dda5;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scanner .msg{position:absolute;bottom:14px;inset-inline:14px;text-align:center;font-size:14px;background:rgba(0,0,0,.55);border-radius:10px;padding:8px}
.scanner .bar{background:#111;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.scanner .bar .chips .chip{background:#222;color:#fff;border-color:#333;font-size:13px;padding:7px 11px}
.scanner .close{background:#222;color:#fff;border-color:#333;margin-top:10px}
.toast{z-index:70!important;pointer-events:none;position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));inset-inline:16px;margin:auto;max-width:520px;z-index:40;background:#14201d;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.stars{display:flex;gap:8px;justify-content:center;margin:8px 0}
.stars button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700;cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px;direction:ltr}
.bars .b{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars .b.hot{background:var(--orange)}
.bars-lbl{display:flex;gap:4px;direction:ltr;font-size:10.5px;color:var(--muted)}
.bars-lbl span{flex:1;text-align:center}
.privacy{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hidden{display:none!important}
.stars button.on,.scale button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.susq{padding:10px 0;border-bottom:1px solid var(--line)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.scale button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:12px}
.seg{border:0;background:none;border-radius:9px;padding:8px 2px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg.on{background:var(--panel);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#report{display:none}
@media print{body.printing > *:not(#report){display:none!important} body.printing #report{display:block} body.printing{padding:0;background:#fff}}

td select{min-width:118px;padding:8px 10px}
.steps-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--orange-soft)}
body.locked header.top, body.locked nav.tabs, body.locked main{display:none}
#welcome{position:fixed;inset:0;z-index:50;overflow:auto;background:radial-gradient(120% 60% at 50% 0%, var(--mint-soft) 0%, var(--bg) 60%);display:flex;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.w-inner{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0}
.w-logo{width:min(80vw,360px,46vh);aspect-ratio:1;border-radius:32px;background:#fff;object-fit:contain;padding:3%;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(46,122,48,.16)}
.w-title{font-size:28px;font-weight:700;color:var(--brand);margin:8px 0 0;line-height:1.2}
.w-sub{color:var(--muted);margin:0;text-align:center;font-size:14px}
.w-stripe{width:132px;height:5px;border-radius:3px;background:var(--stripe);margin:2px 0 6px}
.w-card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.w-card .f:first-child{margin-top:0}
.pin{letter-spacing:6px;text-align:center;font-size:20px;direction:ltr}
.pin::placeholder{letter-spacing:normal;font-size:14px}
.w-err{color:var(--bad);font-size:13px;min-height:1.5em;font-weight:700;text-align:center;margin:8px 0}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;font-size:13px;margin-top:10px;width:100%;cursor:pointer;padding:6px}
.w-foot{font-size:12px;color:var(--muted);text-align:center;max-width:340px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);

const pad = (n) => String(n).padStart(2,'0');
const hm = (t) => { const d = new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const ymd = (t) => { const d = new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const dayName = (t) => new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'long', day:'numeric', month:'long'}).format(new Date(t));
const f1 = (x) => x == null || isNaN(x) ? '—' : (Math.round(x*10)/10).toFixed(1);
const f0 = (x) => x == null || isNaN(x) ? '—' : String(Math.round(x));
const pct = (x) => x == null || isNaN(x) ? '—' : (Math.round(x*1000)/10).toFixed(1)+'%';
const mmss = (ms) => { const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60; return (h? h+':'+pad(m) : m)+':'+pad(ss); };
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const quant = (a,q) => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y); const i = (s.length-1)*q, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi]-s[lo])*(i-lo); };
const mean = (a) => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
let toastTimer;
function toast(msg){ let t = $('#toast'); if (!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); } t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.add('hidden'), 2600); }
const buzz = (p=60) => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

/* ============ حساب الرحلة من أحداثها ============ */
function summarize(j, now=Date.now()){
  const ev = j.events;
  const r = {start: ev[0]?.t, end:null, wait:0, service:0, outbound:0, ret:0, total:0, distance:0, dests:[], segments:[], waits:[], phase:'out', atService:null, svcStarted:false, paused:false, lastLoc:null, lastLeave:null, segPause:0, retStart:null, waitUnknown:false};
  let arriveT=null, svcT=null, pausedSince=null, servicesDone=0;
  for (const e of ev){
    if (e.type==='pause'){ pausedSince = e.t; r.paused = true; continue; }
    if (e.type==='resume'){ if (pausedSince!=null){ r.segPause += e.t - pausedSince; r.pausedMs = (r.pausedMs||0) + (e.t - pausedSince); } pausedSince=null; r.paused=false; continue; }
    if (e.type==='note') continue;
    if (e.cp && ['start','pass','arrive','close'].includes(e.type)){
      if (e.type!=='start' && r.lastLoc && r.lastLeave!=null && e.cp!==r.lastLoc){
        const min = (e.t - r.lastLeave - r.segPause)/60000;
        const d = dist(r.lastLoc, e.cp);
        r.segments.push({from:r.lastLoc, to:e.cp, dir: r.phase==='ret' ? 'عودة' : (servicesDone ? 'بين الخدمات' : 'ذهاب'), min, d});
        if (d) r.distance += d;
      }
      r.lastLoc = e.cp; r.lastLeave = e.t; r.segPause = 0;
      if (e.type==='arrive'){ r.atService = e.cp; arriveT = e.t; r.dests.push(e.cp); r.lastLeave = null; r.svcStarted=false; }
      if (e.type==='close') r.end = e.t;
      continue;
    }
    if (e.type==='svc_start' && r.atService){ svcT = e.t; r.svcStarted = true; const w=(e.t-arriveT)/60000; r.wait += w; r.waits.push({cp:r.atService, min:w}); continue; }
    if ((e.type==='svc_end' || e.type==='return_start' || e.type==='close_incomplete') && r.atService){
      if (svcT!=null) r.service += (e.t-svcT)/60000;
      else { const w=(e.t-arriveT)/60000; r.wait += w; r.waitUnknown = true; }
      r.atService=null; svcT=null; arriveT=null; servicesDone++; r.lastLeave = e.t; r.segPause = 0; r.svcStarted=false;
    }
    if (e.type==='return_start'){ r.phase='ret'; r.retStart = e.t; if (r.lastLeave==null) r.lastLeave = e.t; }
    if (e.type==='close_incomplete'){ r.end = e.t; }
  }
  const end = r.end ?? now;
  r.total = (end - r.start)/60000;
  const outEnd = r.retStart ?? end;
  r.outbound = Math.max(0, (outEnd - r.start)/60000 - r.wait - r.service);
  r.ret = r.retStart ? (end - r.retStart)/60000 : 0;
  r.pausedSince = pausedSince;
  return r;
}

/* ============ النموذج المحلي (تحليلات ذكية دون إنترنت) ============ */
function history(excludeId){ return S.journeys.filter(j => j.status==='completed' && j.id!==excludeId).map(j => ({j, s:summarize(j)})); }
function segStats(list){
  const g = {};
  for (const {s} of list) for (const sg of s.segments){ const k = sg.from+sg.to; (g[k] = g[k] || {from:sg.from, to:sg.to, dir:sg.dir, d:sg.d, mins:[]}).mins.push(sg.min); }
  return Object.values(g).map(x => ({...x, n:x.mins.length, med:median(x.mins), p90:quant(x.mins,.9), ref: x.d ? x.d/(+S.settings.pace||40) : null}));
}
function waitStats(list){
  const g = {};
  for (const {s} of list) for (const w of s.waits) (g[w.cp] = g[w.cp] || []).push(w.min);
  return Object.fromEntries(Object.entries(g).map(([k,v]) => [k, {n:v.length, med:median(v), p90:quant(v,.9)}]));
}
function predict(j){
  const all = history(j.id);
  let pool = all.filter(x => x.j.need===j.need), basis = 'رحلات «'+j.need+'» السابقة';
  if (pool.length < 5){ pool = all; basis = 'كل الرحلات السابقة'; }
  if (pool.length < 5) return null;
  const tot = pool.map(x => x.s.total);
  return {n:pool.length, basis, med:median(tot), p25:quant(tot,.25), p75:quant(tot,.75), p90:quant(tot,.9)};
}
function liveAlerts(j, s, now=Date.now()){
  const out = []; const lim = +S.settings.limit || 1.5;
  const hist = history(j.id);
  if (s.atService){
    if (!s.svcStarted){
      const ws = waitStats(hist)[s.atService];
      const arrive = [...j.events].reverse().find(e => e.type==='arrive');
      const w = (now - arrive.t)/60000;
      if (ws && ws.n>=5 && w > ws.med*lim) out.push({lvl:'warn', txt:`انتظار أطول من المعتاد عند ${CP[s.atService].name}: ${f0(w)} دقيقة مقابل وسيط ${f0(ws.med)} دقيقة.`});
    }
  } else if (s.lastLeave!=null && !s.paused){
    const el = (now - s.lastLeave - s.segPause)/60000;
    const st = segStats(hist).filter(x => x.from===s.lastLoc && x.n>=5);
    let base = st.length ? Math.max(...st.map(x=>x.med)) : null;
    if (base==null){ const ds = Object.keys(CP).map(k => dist(s.lastLoc,k)).filter(Boolean); if (ds.length) base = Math.max(...ds)/(+S.settings.pace||40); }
    if (base!=null && el > base*lim && el > 2) out.push({lvl:'warn', txt:`مضت ${f0(el)} دقيقة منذ آخر نقطة (${CP[s.lastLoc].name}) — أطول من المعتاد. هل نُسي المسح أو يوجد تعثر في المسار؟`});
  }
  const p = predict(j);
  if (p && s.total > p.p90) out.push({lvl:'bad', txt:`الرحلة تجاوزت زمن 90% من ${p.basis} (${f0(p.p90)} دقيقة).`});
  return out;
}
function liftStats(list){
  const all = [], pair = {};
  for (const {s} of list) for (const sg of s.segments) if (isLift(sg.from) && isLift(sg.to)){ all.push(sg.min); const k = sg.from+sg.to; (pair[k] = pair[k] || []).push(sg.min); }
  const slowP = Object.entries(pair).filter(([,v]) => v.length >= 3).sort((a,b) => median(b[1]) - median(a[1]))[0];
  return {n:all.length, med:median(all), p90:quant(all,.9), slow: slowP ? `من الطابق ${FLOOR_NAMES[CP[slowP[0].slice(0,2)].floor]} إلى ${FLOOR_NAMES[CP[slowP[0].slice(2)].floor]} (وسيط ${f1(median(slowP[1]))} دقيقة)` : ''};
}
function insights(list, rangeDays){
  const res = [];
  const comp = list.filter(x => x.j.status==='completed');
  if (list.length < 5) return [{txt:'لا تكفي البيانات بعد لاستخراج أنماط. تظهر التحليلات بعد 5 رحلات على الأقل، أو حمّل البيانات التجريبية من الإعدادات.'}];
  const segs = segStats(comp).filter(x => x.n>=5 && x.ref);
  if (segs.length){
    const w = segs.sort((a,b) => b.med/b.ref - a.med/a.ref)[0];
    const ratio = w.med/w.ref;
    if (ratio > (+S.settings.limit||1.5)) res.push({lvl:'bad', txt:`أكبر نقطة تعثر: مقطع «${CP[w.from].name} ← ${CP[w.to].name}» بوسيط ${f1(w.med)} دقيقة مقابل ${f1(w.ref)} مرجعية (×${f1(ratio)}). يستحق مراجعة المسار أو وقت انتظار المصاعد.`});
    else res.push({txt:`كل المقاطع ضمن الحد المقبول. أبطأها نسبيًا «${CP[w.from].name} ← ${CP[w.to].name}» (×${f1(ratio)} من المرجع).`});
  }
  const lift = liftStats(comp);
  if (lift.n >= 5) res.push({lvl: lift.med > 4 ? 'warn' : undefined, txt:`زمن المصعد (انتظار وصعود أو نزول): وسيط ${f1(lift.med)} دقيقة، ويصل إلى ${f1(lift.p90)} دقيقة في 10% من المرات (${lift.n} مرة). ${lift.slow ? 'أبطأ انتقال: ' + lift.slow + '.' : ''}`});
  const hours = {}; for (const {s} of list){ const h = new Date(s.start).getHours(); hours[h]=(hours[h]||0)+1; }
  const ph = Object.entries(hours).sort((a,b)=>b[1]-a[1])[0];
  if (ph) res.push({txt:`ذروة الطلب بين ${pad(ph[0])}:00 و${pad(+ph[0]+1)}:00 (${ph[1]} رحلة، ${pct(ph[1]/list.length)} من الإجمالي). وجّه الممثلين المتاحين لهذه الساعة.`});
  const ws = Object.entries(waitStats(comp)).filter(([,v])=>v.n>=5).sort((a,b)=>b[1].med-a[1].med)[0];
  if (ws) res.push({txt:`أطول انتظار عند ${CP[ws[0]].name}: وسيط ${f0(ws[1].med)} دقيقة، ويصل إلى ${f0(ws[1].p90)} دقيقة في 10% من الزيارات.`});
  const byNeed = {}; for (const {j,s} of comp) (byNeed[j.need]=byNeed[j.need]||[]).push(s.total);
  const nd = Object.entries(byNeed).filter(([,v])=>v.length>=5).sort((a,b)=>median(b[1])-median(a[1]))[0];
  if (nd) res.push({txt:`أطول الرحلات لفئة «${nd[0]}» بوسيط ${f0(median(nd[1]))} دقيقة — خطّط لها وقتًا أطول عند التوزيع.`});
  const cr = comp.length/list.length;
  if (cr < .9) res.push({lvl:'warn', txt:`نسبة الإكمال ${pct(cr)} أقل من 90%: راجع أسباب الإغلاق قبل الوصول للسيارة في السجل.`});
  // توقع الطلب غدًا وعدد الممثلين
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const byDay = {}; for (const {s} of list){ byDay[ymd(s.start)] = (byDay[ymd(s.start)]||0)+1; }
  const sameWd = Object.entries(byDay).filter(([d]) => new Date(d+'T12:00').getDay()===tomorrow.getDay()).map(([,n])=>n);
  const allDays = Object.values(byDay);
  const base = sameWd.length>=2 ? mean(sameWd) : mean(allDays);
  const medT = median(comp.map(x=>x.s.total));
  if (base && medT){
    const hrs = base*medT/60, reps = Math.max(1, Math.ceil(hrs/(+S.settings.shift||6)));
    res.push({lvl:'ai', txt:`توقع الغد (${dayName(tomorrow)}): نحو ${f0(base)} رحلة ${sameWd.length>=2?'(متوسط الأيام المماثلة)':'(متوسط كل الأيام)'}، أي ${f1(hrs)} ساعة مرافقة ≈ ${reps} ممثل/ممثلين بافتراض ${S.settings.shift} ساعات مرافقة فعلية لكل ممثل.`});
  }
  return res;
}

/* ============ عدّاد خطوات الممثل (مستشعر الحركة في الجوال) ============ */
const Steps = (() => {
  const SENS = {low:1.0, mid:0.6, high:0.4};
  let j = null, on = false, listening = false, sm = null, base = null, above = false, lastStep = 0, pending = 0, regulated = false, peak = 0, peakAvg = 0;
  let lastEv = 0, gotEvent = false, state = 'idle', wake = null, dirty = false, checkTimer = null;
  const resetFilter = () => { sm = null; base = null; above = false; pending = 0; regulated = false; lastStep = 0; lastEv = 0; peak = 0; peakAvg = 0; };
  // خطوة = قمة في شدة التسارع تتجاوز العتبة ثم تهبط، بفاصل 0.28–2 ثانية؛ لا تُحتسب الخطوات إلا بعد 4 خطوات متتالية منتظمة (تجاهل الهزّات العابرة)
  function feed(x, y, z, t){
    if (!on || !j) return 0;
    if (lastEv && t - lastEv < 1000) j.stepCover = (j.stepCover || 0) + (t - lastEv);
    lastEv = t;
    const m = Math.hypot(x, y, z);
    if (sm == null){ sm = m; base = m; return 0; }
    sm += 0.25 * (m - sm); base += 0.02 * (sm - base);
    // عتبة متكيّفة: لا تقل عن حد الحساسية، وترتفع مع قوة حركة الشخص نفسه لتجاهل الاهتزازات الأضعف
    const d = sm - base, T = Math.max(SENS[S.settings.stepSens] || SENS.mid, 0.45 * peakAvg);
    if (!above && d > T){ above = true; peak = d; }
    else if (above){ if (d > peak) peak = d; if (d < T * 0.4){ above = false; peakAvg = peakAvg ? 0.8*peakAvg + 0.2*Math.min(peak, 3*peakAvg) : peak; return step(t); } }
    return 0;
  }
  function step(t){
    const dt = t - lastStep;
    if (lastStep && dt < 280) return 0;
    lastStep = t;
    if (!dt || dt > 2000 || !regulated && pending === 0){ regulated = false; pending = 1; return 0; }
    if (regulated){ j.steps = (j.steps || 0) + 1; dirty = true; return 1; }
    if (++pending >= 4){ regulated = true; j.steps = (j.steps || 0) + pending; pending = 0; dirty = true; return 1; }
    return 0;
  }
  const onMotion = (e) => {
    const a = e.accelerationIncludingGravity || e.acceleration; if (!a || a.x == null) return;
    if (!gotEvent){ gotEvent = true; state = 'sensor'; if (j) j.stepState = 'sensor'; }
    feed(a.x, a.y || 0, a.z || 0, performance.now());
  };
  async function lockScreen(){ try { if (on && 'wakeLock' in navigator && document.visibilityState === 'visible' && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch(e){} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ lastEv = 0; lockScreen(); } });
  function listen(){
    if (listening || typeof window.DeviceMotionEvent === 'undefined'){ if (typeof window.DeviceMotionEvent === 'undefined') state = 'nosensor'; return; }
    window.addEventListener('devicemotion', onMotion); listening = true;
    clearTimeout(checkTimer);
    checkTimer = setTimeout(() => { if (!gotEvent){ state = (typeof DeviceMotionEvent.requestPermission === 'function') ? 'needperm' : 'nosensor'; if (j && j.stepState !== 'sensor') j.stepState = state; } }, 3000);
  }
  return {
    // تُستدعى داخل ضغطة المستخدم (يتطلبها الآيفون)
    askPermission(){ try { if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') return DeviceMotionEvent.requestPermission().then(r => { if (r !== 'granted'){ state = 'denied'; if (j) j.stepState = 'denied'; } else { state = 'waiting'; listen(); } return r; }).catch(() => { state = 'denied'; }); } catch(e){} return Promise.resolve('granted'); },
    start(journey){ if (!S.settings.stepsOn){ state = 'off'; journey.stepState = journey.stepState || 'off'; return; } j = journey; j.steps = j.steps || 0; j.stepCover = j.stepCover || 0; if (!j.stepState) j.stepState = 'waiting'; if (!gotEvent && state !== 'denied') state = 'waiting'; resetFilter(); on = true; listen(); lockScreen(); },
    pause(){ on = false; lastEv = 0; },
    resume(){ if (j){ resetFilter(); on = true; } },
    stop(){ on = false; if (j && j.stepState === 'waiting') j.stepState = state === 'sensor' ? 'sensor' : state; j = null; save(); try { wake && wake.release(); } catch(e){} wake = null; },
    flush(){ if (dirty){ dirty = false; save(); } },
    get state(){ return state; },
    feed, _reset(journey){ j = journey; on = true; resetFilter(); },
  };
})();
const stepCoverage = (j, s) => { const act = s.total*60000 - (s.pausedMs || 0); return act > 0 && j.stepCover ? Math.min(1, j.stepCover/act) : 0; };
const estSteps = (s) => Math.round(s.distance / (+S.settings.stride || 0.7));

/* ============ أوامر الرحلة ============ */
const active = () => S.journeys.find(j => j.id===S.activeId && j.status==='open') || null;
function newId(){
  const d = new Date(), k = String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate());
  S.daySeq[k] = (S.daySeq[k]||0)+1;
  return `SJ-${k}-${S.settings.device}-${String(S.daySeq[k]).padStart(3,'0')}`;
}
let scanMeta = null;
function addEvent(j, type, extra={}){ if (extra.cp && scanMeta){ Object.assign(extra, scanMeta); scanMeta = null; } j.events.push({t:Date.now(), type, ...extra}); save(); }
function startJourney(need, cp){
  const j = {id:newId(), created:Date.now(), need, rep:S.settings.rep, status:'open', events:[], satisfaction:null};
  j.events.push({t:Date.now(), type:'start', cp, ...(scanMeta || {})}); scanMeta = null;
  S.journeys.unshift(j); S.activeId = j.id; Steps.start(j); save(); buzz(); render();
  toast(`بدأت الرحلة ${j.id}`);
}
function handleScan(cp){
  const j = active();
  if (!j){ startFlow(cp); return; }
  const s = summarize(j);
  if (s.paused){ toast('المرافقة معلّقة — استأنف أولًا'); return; }
  if (cp === s.lastLoc && !s.atService){ toast('هذه النقطة مسجّلة للتو'); return; }
  if (s.atService){
    if (cp === s.atService){ toast('أنت عند هذه النقطة — سجّل بدء الخدمة أو المغادرة'); return; }
    sheet(`<h2>لم تُسجَّل المغادرة من ${esc(CP[s.atService].name)}</h2><p class="muted small">سيُسجَّل انتهاء الخدمة الآن ثم المرور بـ${esc(CP[cp].name)}. الأدق أن تسجّل المغادرة لحظة حدوثها.</p>
      <div class="stack"><button class="btn primary" data-act="leaveThenPass">تسجيل المغادرة والمرور</button><button class="btn" data-act="closeSheet">إلغاء</button></div>`, {leaveThenPass(){ addEvent(j,'svc_end'); addEvent(j,'pass',{cp}); closeSheet(); afterEvent('مرور: '+CP[cp].name); }});
    return;
  }
  if (s.phase==='out' && CP[cp].kind==='service'){
    sheet(`<h2>${esc(CP[cp].name)}</h2><p class="muted small">هل وصل المستفيد لتلقي خدمة هنا، أم أنها نقطة مرور على الطريق؟</p>
      <div class="stack"><button class="btn primary" data-act="arrive">وصول لتلقي الخدمة</button><button class="btn" data-act="pass">مرور فقط</button></div>`,
      {arrive(){ addEvent(j,'arrive',{cp}); closeSheet(); afterEvent('وصول: '+CP[cp].name); }, pass(){ addEvent(j,'pass',{cp}); closeSheet(); afterEvent('مرور: '+CP[cp].name); }});
    return;
  }
  if (s.phase==='ret' && cp==='01'){
    sheet(`<h2>الوصول إلى المواقف</h2><p class="muted small">أكّد فقط بعد وصول المستفيد إلى سيارته أو نقطة المغادرة المعتمدة.</p>
      <div class="stack"><button class="btn primary" data-act="close">تأكيد الوصول للسيارة وإغلاق الرحلة</button><button class="btn" data-act="pass">مرور فقط</button></div>`,
      {close(){ addEvent(j,'close',{cp}); closeSheet(); satisfactionFlow(j); }, pass(){ addEvent(j,'pass',{cp}); closeSheet(); afterEvent('مرور: '+CP[cp].name); }});
    return;
  }
  addEvent(j,'pass',{cp}); afterEvent('مرور: '+CP[cp].name);
}
function afterEvent(msg){ buzz(); render(); if (msg) toast(msg); }
function startFlow(cp){
  let need = null;
  const draw = () => sheet(`<h2>رحلة جديدة</h2>
    <p class="muted small">اختر الاحتياج الوظيفي للمرافقة فقط. لا تُسجَّل أسماء أو أرقام ملفات أو تشخيصات.</p>
    <div class="chips" style="margin:10px 0 14px">${NEEDS.map(n => `<button class="chip ${n===need?'on':''}" data-act="need" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p class="small"><b>نقطة الانطلاق:</b> ${cp ? esc(CP[cp].name)+' <span class="num muted">SANAD-CP-'+cp+'</span>' : '<span class="muted">امسح رمز النقطة التي تبدأ منها</span>'}</p>
    <div class="stack" style="margin-top:10px">
      ${cp ? `<button class="btn primary" data-act="go" ${need?'':'disabled'}>بدء الرحلة</button>` : `<button class="btn primary" data-act="scanStart">مسح نقطة الانطلاق</button>`}
      <button class="btn" data-act="closeSheet">إلغاء</button>
    </div>`, {
      need(el){ need = el.dataset.v; draw(); },
      scanStart(){ closeSheet(); openScanner(c => { cp = c; draw(); }); },
      go(){ if (!need) return; if (S.settings.stepsOn) Steps.askPermission(); closeSheet(); startJourney(need, cp); },
    });
  draw();
}
function satisfactionFlow(j){
  const fb = {rate:null, safe:null, easier:null};
  const pick = (key, el) => { fb[key] = key === 'rate' ? +el.dataset.v : el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); };
  sheet(`<h2>اكتملت الرحلة ✓</h2>
    <p class="muted small">أسئلة اختيارية للمستفيد، دون أي بيانات شخصية. يمكن تخطيها.</p>
    <p class="small" style="margin:10px 0 0"><b>1. ما مدى سهولة الوصول إلى خدماتك اليوم؟</b></p>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="rate" data-v="${n}" class="num">${n}</button>`).join('')}</div>
    <p class="muted small" style="text-align:center;margin:0">1 صعبة جدًا · 5 سهلة جدًا</p>
    <p class="small" style="margin:12px 0 6px"><b>2. هل شعرت بالاطمئنان أثناء المرافقة؟</b></p>

let scanStop = null;
async function openScanner(onCode){
  const L = document.createElement('div'); L.className='scanner';
  L.innerHTML = `<div class="vwrap"><video playsinline muted></video><div class="frame"></div><div class="msg" id="scanMsg">وجّه الكاميرا إلى رمز النقطة</div></div>
    <div class="bar"><div class="small" style="margin-bottom:8px;opacity:.85">أو اختر النقطة يدويًا إذا تعذّر المسح:</div>
    <div class="chips">${CP_ORDER.map(k=>`<button class="chip" data-cp="${k}">${k} · ${esc(CP[k].name)}</button>`).join('')}</div>
    <button class="btn close">إغلاق</button></div>`;
  document.body.appendChild(L);
  const video = L.querySelector('video'), msg = L.querySelector('#scanMsg');
  let stream = null, alive = true, lastBad = 0;
  const stop = () => { alive=false; if (stream) stream.getTracks().forEach(t=>t.stop()); L.remove(); scanStop=null; };
  scanStop = stop;
  const openedAt = performance.now();
  const done = (cp, manual) => { stop(); buzz(); scanMeta = {manual:!!manual, scanMs:Math.round(performance.now() - openedAt)}; onCode(cp); };
  L.querySelector('.close').onclick = stop;
  L.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => done(b.dataset.cp, true));
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no-media');
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    if (!alive){ stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = stream; await video.play();
  } catch(e){ msg.textContent = 'تعذّر تشغيل الكاميرا هنا — اختر النقطة من القائمة بالأسفل'; return; }
  let detector = null;
  try { if ('BarcodeDetector' in window){ const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) detector = new BarcodeDetector({formats:['qr_code']}); } } catch(e){ detector = null; }
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
  const tick = async () => {
    if (!alive) return;
    try {
      if (video.readyState >= 2){
        let text = null;
        if (detector){ const codes = await detector.detect(video); if (codes.length) text = codes[0].rawValue; }
        else if (window.jsQR){
          const sc = Math.min(1, 640/Math.max(video.videoWidth, video.videoHeight));
          canvas.width = Math.round(video.videoWidth*sc); canvas.height = Math.round(video.videoHeight*sc);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const c = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'}); if (c) text = c.data;
        }
        if (text){ const cp = parseCode(text); if (cp) return done(cp); if (Date.now()-lastBad > 2000){ lastBad = Date.now(); msg.textContent = 'رمز غير تابع لنقاط سند'; } }
      }
    } catch(e){}
    setTimeout(tick, detector ? 150 : 220);
  };
  tick();
}

function bindSettings(){
  const map = {sRep:'rep', sDev:'device', sPace:'pace', sLim:'limit', sShift:'shift', sRet:'retention', sSteps:'stepsOn', sSens:'stepSens', sStride:'stride'};
  for (const [id,k] of Object.entries(map)){ const el = $('#'+id); el.addEventListener('change', () => {
    let v = el.value.trim(); if (el.type==='number') v = +v;
    if (k==='stepsOn') v = v === 'on';
    if (k==='device') v = v.toUpperCase().replace(/[^A-Z0-9]/g,'') || S.settings.device;
    if (k==='rep' && /\d{5,}/.test(v)) { toast('استخدم رمزًا قصيرًا وليس رقمًا وظيفيًا أو هوية'); el.value = S.settings.rep; return; }
    S.settings[k] = v; if (k==='retention') purgeOld(); save(); $('#repTxt').textContent = S.settings.rep; toast('حُفظ'); }); }
  document.querySelectorAll('[data-floor]').forEach(el => el.addEventListener('change', () => { if (el.value === '') delete S.settings.floors[el.dataset.floor]; else S.settings.floors[el.dataset.floor] = +el.value; save(); toast('حُفظ الطابق'); }));
  document.querySelectorAll('[data-dist]').forEach(el => el.addEventListener('change', () => { const [a,b] = el.dataset.dist.split('|'); delete S.dist[b+'|'+a]; if (el.value.trim() === '') delete S.dist[a+'|'+b]; else S.dist[a+'|'+b] = Math.max(0, +el.value); S.distDemo = false; save(); toast('حُفظت المسافة'); }));
  document.querySelectorAll('[data-base]').forEach(el => el.addEventListener('change', () => { const v = el.value.trim(); if (v === '') delete S.baseline[el.dataset.base]; else S.baseline[el.dataset.base] = +v; save(); toast('حُفظ خط الأساس'); }));
}

/* ============ التصدير ============ */
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const csvCell = (v) => { v = v==null ? '' : String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
const csv = (rows, cols) => '﻿' + [cols.join(','), ...rows.map(r => cols.map(c=>csvCell(r[c])).join(','))].join('\n');
const stamp = () => { const d = new Date(); return ymd(d)+'_'+pad(d.getHours())+pad(d.getMinutes()); };
function journeyRow(j){
  const s = summarize(j), done = j.status==='completed', r1 = (x)=>Math.round(x*10)/10;
  return {journey_id:j.id, date:ymd(s.start), start_hour:new Date(s.start).getHours(), rep:j.rep, need:j.need, destinations:s.dests.map(c=>CP[c].name).join(' ← '), stops:s.dests.length,
    outbound_min:r1(s.outbound), wait_min:r1(s.wait), service_min:r1(s.service), return_min: done? r1(s.ret):'', total_min: done? r1(s.total):'', distance_m:Math.round(s.distance), status:STATUS[j.status], satisfaction:j.satisfaction ?? '', steps: j.stepState==='sensor' ? (j.steps||0) : '', steps_coverage: j.stepState==='sensor' ? Math.round(stepCoverage(j,s)*100)/100 : '', steps_estimated: estSteps(s)};
}
function exportJourneys(){
  const rows = S.journeys.filter(j=>j.status!=='open').sort((a,b)=>a.created-b.created).map(journeyRow);
  if (!rows.length) return toast('لا توجد رحلات مغلقة للتصدير');
  download(`sanad_journeys_${stamp()}.csv`, csv(rows, Object.keys(rows[0])), 'text/csv;charset=utf-8'); toast(`صُدّرت ${rows.length} رحلة`);
}
function exportEvents(){
  const rows = [];
  for (const j of [...S.journeys].sort((a,b)=>a.created-b.created)) for (const e of j.events) rows.push({journey_id:j.id, time:new Date(e.t).toISOString(), event:e.type, event_ar:EV[e.type], checkpoint_id:e.cp?'SANAD-CP-'+e.cp:'', checkpoint:e.cp?CP[e.cp].name:'', note:e.note||'', rep:j.rep, need:j.need});
  if (!rows.length) return toast('لا توجد أحداث');
  download(`sanad_events_${stamp()}.csv`, csv(rows, Object.keys(rows[0])), 'text/csv;charset=utf-8'); toast(`صُدّر ${rows.length} حدث`);
}
function backupJSON(){ download(`sanad_backup_${stamp()}.json`, JSON.stringify({app:'sanad-local', version:2, kind:'backup', exported:new Date().toISOString(), device:S.settings.device, rep:S.settings.rep, journeys:S.journeys, sus:S.sus, stepTests:S.stepTests}, null, 1), 'application/json'); toast('حُفظت النسخة الاحتياطية'); }

function loadDemo(){
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  const pick = (a) => a[Math.floor(rnd()*a.length)];
  const gauss = () => { let u=0,v=0; while(!u) u=rnd(); while(!v) v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const speed = {'كرسي متحرك':44,'مساعدة في المشي':34,'كبير سن':37,'إعاقة بصرية':33};
  const svc = {'04':[3,12,2,5], '05':[15,45,10,20], '11':[8,20,5,8], '12':[15,40,10,20], '07':[10,25,3,5], '08':[3,10,2,4]};
  const DEMO_FLOOR = {'04':0, '05':1, '11':1, '12':2, '07':0, '08':1};
  const fl = (k) => floorOf(k) ?? DEMO_FLOOR[k] ?? 0;
  if (!Object.keys(S.dist).length){
    S.dist = {'01|02':120,'02|03':35,'03|04':25,'03|E0':70,'04|E0':60,'E0|E1':0,'E0|E2':0,'E1|E2':0,'E1|05':50,'E1|11':70,'E1|08':40,'05|11':60,'05|08':45,'E2|12':60,'E0|07':80,'04|07':55,'07|09':60,'E0|09':70,'03|09':50,'09|01':140};
    S.distDemo = true;
  }
  const needW = [['كرسي متحرك',.45],['مساعدة في المشي',.3],['كبير سن',.15],['إعاقة بصرية',.1]];
  const out = []; let seq = 0;
  for (let k=14; k>=1; k--){
    const day = new Date(); day.setHours(0,0,0,0); day.setDate(day.getDate()-k);
    const wd = day.getDay(); const n = Math.max(3, Math.round((wd===5?8: wd===6?13: 26) + gauss()*3));
    for (let i=0;i<n;i++){
      let r = rnd(), need = needW[0][0], acc=0; for (const [nm,p] of needW){ acc+=p; if (r<=acc){ need=nm; break; } }
      const hw = [3,8,10,9,7,5,4,3,2]; let x = rnd()*hw.reduce((a,b)=>a+b), hour=7; for (let h=0;h<hw.length;h++){ x-=hw[h]; if (x<=0){ hour=7+h; break; } }
      let t = day.getTime() + hour*36e5 + Math.floor(rnd()*3600)*1000;
      const sp = speed[need]; const peak = hour>=9 && hour<=11;
      const dests = [];
      if (rnd() < .9) dests.push('04');
      if (rnd() < .85) dests.push('05');
      if (rnd() < .35) dests.push(rnd() < .6 ? '11' : '12');
      if (rnd() < .3) dests.push('08');
      if (rnd() < .65 || !dests.length) dests.push('07');
      const ev = [{t, type:'start', cp:'01'}];
      let cur = '01', curF = 0;
      const go = (b, type='pass') => { const a = cur, d = dist(a,b); let m;
        if (isLift(a) && isLift(b)) m = 1.2 + rnd()*2.5 + (peak ? 1 + rnd()*3 : 0);
        else m = ((d ?? 60)/sp) * Math.exp(gauss()*.18) + (a==='09' && b==='01' ? 1 + rnd()*2 : 0);
        t += m*60000; ev.push({t, type, cp:b}); cur = b; };
      const moveTo = (b, type) => { const fb = fl(b); if (fb !== curF){ go('E'+curF); go('E'+fb); curF = fb; } go(b, type); };
      go('02'); go('03');
      const complete = rnd() > .06;
      dests.forEach((d,i) => { moveTo(d, 'arrive'); const [w1,w2,s1,s2] = svc[d]; t += (w1+rnd()*(w2-w1))*(peak?1.3:1)*60000; ev.push({t, type:'svc_start'}); t += (s1+rnd()*(s2-s1))*60000;
        if (i+1 < dests.length) ev.push({t, type:'svc_end'}); });
      if (complete){ ev.push({t, type:'return_start'}); moveTo('09'); go('01', 'close'); }
      else ev.push({t, type:'close_incomplete', note:pick(INCOMPLETE_REASONS)});
      seq++;
      out.push({id:`DEMO-${String(seq).padStart(4,'0')}`, created:ev[0].t, need, rep:'ممثل 0'+(1+Math.floor(rnd()*6)), status: complete?'completed':'incomplete', events:ev, satisfaction: complete && rnd()<.62 ? Math.max(1, 5-(rnd()<.18?1:0)-(rnd()<.05?1:0)) : null, demo:true});
      { const dj = out[out.length-1], ds = summarize(dj); const cov = .78 + rnd()*.22; dj.stepState = 'sensor'; dj.steps = Math.round(ds.distance/0.68*(0.92+rnd()*0.2)*cov + rnd()*60); dj.stepCover = cov*ds.total*60000; }
    }
  }
  for (const dj of out){
    if (dj.satisfaction) dj.feedback = {safe: rnd()<.86?'yes':rnd()<.8?'some':'no', easier: rnd()<.82?'yes':rnd()<.8?'some':'no'};
    for (const e of dj.events) if (e.cp){ e.manual = rnd() < .07; e.scanMs = Math.round((e.manual ? 6000 : 1500) + rnd()*3500); }
    if (rnd() < .05) dj.undos = 1;
    if (rnd() < .04){ const i = dj.events.findIndex(e => e.type==='svc_start'); if (i > 0) dj.events.splice(i, 1); }
    if (dj.status==='completed' && rnd() < .08) dj.refTotal = Math.round((summarize(dj).total + gauss()*0.7)*10)/10;
  }
  const now = Date.now();
  S.sus = S.sus.filter(x=>!x.demo); S.stepTests = S.stepTests.filter(x=>!x.demo);
  for (let r=1; r<=6; r++){ const ans = Array.from({length:10}, (_,i) => i%2===0 ? 4 + (rnd()<.4?1:0) - (rnd()<.1?1:0) : 2 - (rnd()<.5?1:0) + (rnd()<.1?1:0)); S.sus.push({at:now-r*864e5, rep:'ممثل 0'+r, device:'DEMO', answers:ans, score:susScore(ans), disrupt: rnd()<.83?'never':'some', demo:true}); }
  [['hand',100,93],['pocket',100,98],['belt',100,104],['pocket',120,116],['hand',100,91],['pocket',100,101]].forEach(([p,a,c],i) => S.stepTests.push({at:now-i*36e5, rep:'ممثل 0'+(i+1), device:'DEMO', place:p, actual:a, counted:c, err:(c-a)/a, demo:true}));
  S.journeys = S.journeys.filter(j=>!j.demo).concat(out).sort((a,b)=>b.created-a.created); save(); render(); toast(`حُمّلت ${out.length} رحلة تجريبية`);
}

const susScore = (a) => 2.5 * a.reduce((t, v, i) => t + (i % 2 === 0 ? v - 1 : 5 - v), 0);
const deviceOf = (j) => j.demo ? 'تجريبي' : ((String(j.id).match(/^SJ-\d{6}-([A-Z0-9]+)-/) || [])[1] || '؟');

function susDue(){
  const mine = S.journeys.filter(j => !j.demo && j.rep === S.settings.rep && j.status !== 'open').length;
  const last = S.sus.filter(x => x.rep === S.settings.rep && !x.demo).sort((a,b) => b.at - a.at)[0];
  return mine >= 10 && (!last || Date.now() - last.at > 14*864e5);
}

/* ---------- جودة البيانات وعبء التوثيق ---------- */
function segMedians(){ const m = {}; for (const x of segStats(history())) m[x.from+x.to] = x.med; return m; }
function qualityFlags(j, s, segMed){
  const f = [];
  if (s.waitUnknown) f.push('لم يُسجَّل «بدء تلقي الخدمة»، فلا يمكن فصل الانتظار عن الخدمة');
  for (const sg of s.segments){
    const fa = floorOf(sg.from), fb = floorOf(sg.to);
    if (fa != null && fb != null && fa !== fb && !isLift(sg.from) && !isLift(sg.to)){ f.push(`تغيّر الطابق دون مسح بهو المصاعد: ${CP[sg.from].name} ← ${CP[sg.to].name}`); break; }
    const ref = sg.d ? sg.d/(+S.settings.pace||40) : 0, base = Math.max(segMed[sg.from+sg.to] || 0, ref);
    if (!base) continue;
    if (sg.min > 3*base && sg.min > 5){ f.push(`مقطع أطول من المعتاد بكثير: ${CP[sg.from].name} ← ${CP[sg.to].name} (${f0(sg.min)} دقيقة)`); break; }
  }
  if (j.status === 'completed' && !j.events.some(e => e.type === 'return_start')) f.push('لم يُسجَّل «بدء رحلة العودة»');
  return f;
}
function qualityMetrics(list){
  const segMed = segMedians();
  const rows = list.map(x => ({...x, flags:qualityFlags(x.j, x.s, segMed)}));
  const cpEv = list.flatMap(x => x.j.events.filter(e => e.cp && e.manual !== undefined));
  const camMs = cpEv.filter(e => !e.manual && e.scanMs).map(e => e.scanMs/1000);
  const sensor = list.filter(x => x.j.stepState === 'sensor');
  const ref = list.filter(x => x.j.refTotal != null && x.j.status === 'completed');
  return {
    rows, n:list.length,
    documented: list.length ? rows.filter(r => !r.flags.length).length / list.length : null,
    waitUnknown: list.length ? list.filter(x => x.s.waitUnknown).length / list.length : null,
    eventsPer: mean(list.map(x => x.j.events.filter(e => e.type !== 'note').length)),
    scanSec: median(camMs), manual: cpEv.length ? cpEv.filter(e => e.manual).length / cpEv.length : null,
    undo: list.length ? list.filter(x => x.j.undos).length / list.length : null,
    coverage: mean(sensor.map(x => stepCoverage(x.j, x.s))),
    refN: ref.length, refErr: mean(ref.map(x => Math.abs(x.s.total - x.j.refTotal))),
  };
}

/* ---------- مؤشرات تقييم التجربة ---------- */
function pilotMetrics(list){
  const q = qualityMetrics(list);
  const fb = list.map(x => x.j.feedback).filter(Boolean);
  const safeA = fb.filter(f => f.safe), easyA = fb.filter(f => f.easier);
  const sat = list.map(x => x.j.satisfaction).filter(Boolean);
  const sus = S.sus.filter(x => !range || x.at >= Date.now() - range*864e5);
  const dis = sus.filter(x => x.disrupt);
  const tests = S.stepTests.filter(x => !range || x.at >= Date.now() - range*864e5);
  const notes = list.flatMap(x => x.j.events.filter(e => e.type === 'note'));
  const comp = list.filter(x => x.j.status === 'completed');
  const criteria = [
    {k:'اكتمال التوثيق', v:q.documented, fmt:pct, target:'90% فأكثر', ok:(v) => v >= .9, how:'رحلات دون أي ملاحظة جودة'},
    {k:'دقة الزمن مقابل ساعة الإيقاف', v:q.refN ? q.refErr : null, fmt:(v) => f1(v)+' دقيقة', target:'فرق ≤ 2 دقيقة للرحلة', ok:(v) => v <= 2, how:`${q.refN} رحلة مُتحقق منها`},
    {k:'دقة عدّ الخطوات', v:tests.length ? mean(tests.map(t => Math.abs(t.err))) : null, fmt:pct, target:'خطأ < 10%', ok:(v) => v < .1, how:`${tests.length} اختبار`},
    {k:'تغطية مستشعر الخطوات', v:q.coverage, fmt:pct, target:'60% فأكثر', ok:(v) => v >= .6, how:'متوسط زمن الرحلة المغطى'},
    {k:'سهولة الاستخدام (SUS)', v:sus.length ? mean(sus.map(x => x.score)) : null, fmt:(v) => f0(v)+' / 100', target:'70 فأكثر', ok:(v) => v >= 70, how:`${sus.length} استبيان`},
    {k:'لا يعطّل المرافقة', v:dis.length ? dis.filter(x => x.disrupt === 'never').length / dis.length : null, fmt:pct, target:'80% «أبدًا»', ok:(v) => v >= .8, how:'إجابات الممثلين'},
    {k:'رضا المستفيد', v:sat.length ? mean(sat) : null, fmt:(v) => f1(v)+' / 5', target:'4 فأكثر', ok:(v) => v >= 4, how:`${sat.length} إجابة`},
    {k:'الشعور بالاطمئنان', v:safeA.length ? safeA.filter(f => f.safe === 'yes').length / safeA.length : null, fmt:pct, target:'80% «نعم»', ok:(v) => v >= .8, how:`${safeA.length} إجابة`},
    {k:'المرافقة سهّلت الوصول', v:easyA.length ? easyA.filter(f => f.easier === 'yes').length / easyA.length : null, fmt:pct, target:'80% «نعم»', ok:(v) => v >= .8, how:`${easyA.length} إجابة`},
    {k:'تعطّل المرافقة بسبب التطبيق', v:list.length ? notes.filter(e => e.kind === 'app').length : null, fmt:(v) => String(v), target:'صفر', ok:(v) => v === 0, how:`بلاغات سلامة أخرى: ${notes.filter(e => e.kind === 'safety').length}`},
  ];
  const b = S.baseline || {};
  const after = {n:list.length, total:mean(comp.map(x => x.s.total)), wait:mean(list.map(x => x.s.wait)), comp:list.length ? comp.length/list.length : null, sat:sat.length ? mean(sat) : null};
  const before = {n:b.n || null, total:b.total || null, wait:b.wait || null, comp:b.comp ? b.comp/100 : null, sat:b.sat || null};
  return {q, criteria, before, after, hasDemo:list.some(x => x.j.demo)};
}
const statusCell = (c) => c.v == null ? '<span class="muted">لم يُقَس</span>' : c.ok(c.v) ? '<b style="color:var(--ok)">✓ تحقق</b>' : '<b style="color:var(--bad)">✗ لم يتحقق</b>';
function compareRows(m){
  const d = (a, b, f, unit, goodDown) => { if (a == null || b == null) return '—'; const x = b - a; const good = goodDown ? x < 0 : x > 0; return `<span style="color:${x === 0 ? 'inherit' : good ? 'var(--ok)' : 'var(--bad)'}">${x > 0 ? '+' : x < 0 ? '−' : ''}${f(Math.abs(x))}${unit}</span>`; };
  const B = m.before, A = m.after;
  return [
    ['الرحلات المقاسة', B.n != null ? f0(B.n) : '—', f0(A.n), '—'],
    ['متوسط الزمن الكلي (دقيقة)', B.total != null ? f1(B.total) : '—', f1(A.total), d(B.total, A.total, f1, '', true)],
    ['متوسط الانتظار (دقيقة)', B.wait != null ? f1(B.wait) : '—', f1(A.wait), d(B.wait, A.wait, f1, '', true)],
    ['نسبة الإكمال حتى السيارة', B.comp != null ? pct(B.comp) : '—', pct(A.comp), d(B.comp != null ? B.comp*100 : null, A.comp != null ? A.comp*100 : null, f1, ' نقطة', false)],
    ['متوسط الرضا (من 5)', B.sat != null ? f1(B.sat) : '—', A.sat != null ? f1(A.sat) : '—', d(B.sat, A.sat, f1, '', false)],
  ];
}

async function sendToSupervisor(){
  const journeys = S.journeys.filter(j => j.status !== 'open' && !j.demo);
  if (!journeys.length) return toast('لا توجد رحلات للإرسال بعد');
  const data = {app:'sanad-local', version:2, kind:'rep-export', exported:new Date().toISOString(), device:S.settings.device, rep:S.settings.rep, journeys, sus:S.sus.filter(x => !x.demo), stepTests:S.stepTests.filter(x => !x.demo)};
  const name = `sanad_${S.settings.device}_${stamp()}.json`, text = JSON.stringify(data);
  const done = (msg) => { S.lastSentAt = Date.now(); save(); render(); toast(msg); };
  try {
    const file = new File([text], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'بيانات سند', text:`${journeys.length} رحلة · ${S.settings.rep}`}); return done('أُرسلت البيانات'); }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  download(name, text, 'application/json'); done('حُفظ الملف — أرسله للمشرف');
}
async function importFiles(files){
  let added = 0, ok = 0;
  for (const f of files){
    try {
      const d = JSON.parse(await f.text()); if (!Array.isArray(d.journeys)) throw 0;
      const have = new Set(S.journeys.map(j => j.id)); let n = 0;
      for (const j of d.journeys){ if (j && j.id && Array.isArray(j.events) && !have.has(j.id)){ for (const e of j.events) if (e.cp && LEGACY[e.cp]) e.cp = LEGACY[e.cp]; S.journeys.push(j); have.add(j.id); n++; } }
      const sk = new Set(S.sus.map(x => x.at + '|' + x.rep)); for (const x of d.sus || []) if (x && x.at && !sk.has(x.at + '|' + x.rep)){ S.sus.push(x); sk.add(x.at + '|' + x.rep); }
      const tk = new Set(S.stepTests.map(x => x.at + '|' + x.rep)); for (const x of d.stepTests || []) if (x && x.at && !tk.has(x.at + '|' + x.rep)){ S.stepTests.push(x); tk.add(x.at + '|' + x.rep); }
      S.imports.unshift({at:Date.now(), file:f.name, device:d.device || '', rep:d.rep || '', added:n, inFile:d.journeys.length});
      added += n; ok++;
    } catch(e){}
  }
  S.imports = S.imports.slice(0, 100); S.journeys.sort((a,b) => b.created - a.created); save(); render();
  toast(`أُضيفت ${added} رحلة جديدة من ${ok} ملف` + (files.length - ok ? ` · ${files.length - ok} ملف غير صالح` : ''));
}
document.addEventListener('change', (e) => { if (e.target.matches && e.target.matches('input[data-import]')){ const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importFiles(fs); } });

const REPORT_CSS = `#report{font-family:Kufi,Tahoma,sans-serif;color:#111;line-height:1.6}#report .r-head{display:flex;gap:14px;align-items:center;border-bottom:4px solid #2e7a30;padding-bottom:10px;margin-bottom:10px}#report .r-head img{width:72px;height:72px;object-fit:contain}#report h1{font-size:20px;margin:0;color:#2e7a30}#report h2{font-size:15px;margin:18px 0 6px;color:#2e7a30}#report p{margin:4px 0;font-size:12px}#report table{width:100%;border-collapse:collapse;font-size:12px}#report th,#report td{border:1px solid #ccd5cc;padding:5px 7px;text-align:start;vertical-align:top}#report th{background:#eef5ec}#report small{color:#555}#report ul{font-size:12px;padding-inline-start:18px}#report .r-warn{color:#b3261e;font-weight:700}#report .r-foot{color:#666;margin-top:16px;border-top:1px solid #ddd;padding-top:6px}`;
function printReport(){
  let r = $('#report'); if (!r){ r = document.createElement('div'); r.id = 'report'; document.body.appendChild(r); }
  r.innerHTML = reportHtml(inRange());
  document.body.classList.add('printing');
  const off = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', off); };
  window.addEventListener('afterprint', off); setTimeout(() => { try { window.print(); } catch(e){ off(); toast('الطباعة غير متاحة هنا — استخدم «حفظ التقرير كملف»'); } }, 50);
}
function saveReport(){
  download(`sanad_pilot_report_${stamp()}.html`, `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير تجربة سند</title><style>body{margin:24px;background:#fff}${REPORT_CSS}@media print{body{margin:10mm}}</style></head><body><div id="report">${reportHtml(inRange())}</div></body></html>`, 'text/html;charset=utf-8');
  toast('حُفظ التقرير — افتحه واطبعه أو احفظه PDF');
}

/* ============ صفحة الدخول (قفل محلي للجهاز) ============ */

const SKEY = 'sanad.session';
let memSession = false, fails = 0, lockUntil = 0;
const sessionOK = () => { try { return sessionStorage.getItem(SKEY) === S.settings.device; } catch(e){ return memSession; } };
const setSession = (on) => { memSession = on; try { on ? sessionStorage.setItem(SKEY, S.settings.device) : sessionStorage.removeItem(SKEY); } catch(e){} };
async function hashPin(pin){
  const txt = 'sanad|' + S.settings.device + '|' + pin;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return 'sha256:' + [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h = 2166136261; for (const c of txt){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return 'fnv:' + h.toString(16); }
}

    <form class="w-card" id="wForm" autocomplete="off" novalidate>
      <label class="f" for="wRep">رمز الممثل</label>
      <input type="text" id="wRep" value="${esc(S.settings.rep)}" maxlength="20" placeholder="مثال: ممثل 03">
      ${has ? `<label class="f" for="wPin">رمز الدخول</label>
      <input class="pin" id="wPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">`
      : `<label class="f" for="wPin">رمز دخول للجهاز <span class="muted">(اختياري، 4–8 أرقام)</span></label>
      <input class="pin" id="wPin" type="password" inputmode="numeric" maxlength="8" placeholder="بدون رمز">
      <input class="pin" id="wPin2" type="password" inputmode="numeric" maxlength="8" placeholder="تأكيد الرمز" style="margin-top:8px">`}
      <div class="w-err" id="wErr" role="alert"></div>
      <button class="btn primary" type="submit">${has ? 'دخول' : 'بدء الاستخدام'}</button>
      ${has ? '<button type="button" class="linkbtn" id="wForgot">نسيت رمز الدخول؟</button>' : ''}
    </form>
    <p class="w-foot">🔒 يعمل على هذا الجهاز فقط ودون إنترنت. لا يتصل بأنظمة المستشفى ولا يحفظ أي بيانات صحية أو شخصية.</p>
  </div>`;
  const form = $('#wForm'), err = $('#wErr');
  const fail = (m) => { err.textContent = m; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); buzz(80); };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const rep = $('#wRep').value.trim(), pin = $('#wPin').value.trim(), pin2 = $('#wPin2')?.value.trim() ?? '';
    if (!rep) return fail('اكتب رمز الممثل');
    if (/\d{5,}/.test(rep)) return fail('استخدم رمزًا قصيرًا، لا رقمًا وظيفيًا أو هوية');
    if (has){
      if (Date.now() < lockUntil) return fail(`محاولات كثيرة — انتظر ${Math.ceil((lockUntil-Date.now())/1000)} ثانية`);
      if (await hashPin(pin) !== S.settings.pinHash){ if (++fails >= 5){ fails = 0; lockUntil = Date.now() + 30000; } return fail('رمز الدخول غير صحيح'); }
      fails = 0;
    } else if (pin || pin2){
      if (!/^\d{4,8}$/.test(pin)) return fail('رمز الدخول من 4 إلى 8 أرقام');
      if (pin !== pin2) return fail('الرمزان غير متطابقين');
      S.settings.pinHash = await hashPin(pin);
    }
    S.settings.rep = rep; save(); setSession(true); hideWelcome();
  });
  $('#wForgot')?.addEventListener('click', () => sheet(`<h2>نسيت رمز الدخول؟</h2>
    <p class="small">رمز الدخول يحمي بيانات هذا الجهاز ولا يمكن تجاوزه. الحل الوحيد هو حذف كل الرحلات المحفوظة عليه وإعداده من جديد.</p>
    <div class="stack"><button class="btn danger" data-act="resetAll">حذف البيانات وإعادة الإعداد</button><button class="btn" data-act="closeSheet">رجوع</button></div>`, {
      resetAll(){ const dev = S.settings.device; S = structuredClone(DEFAULTS); S.settings.device = dev; save(); closeSheet(); showWelcome(); toast('أُعيد إعداد الجهاز'); }
    }));
  setTimeout(() => (has ? $('#wPin') : $('#wRep'))?.focus({preventScroll:true}), 80);
}
function hideWelcome(){ $('#welcome')?.remove(); document.body.classList.remove('locked'); tab = 'journey'; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x.dataset.tab==='journey')); render(); window.scrollTo(0,0); }
function pinFlow(){
  const has = !!S.settings.pinHash;
  sheet(`<h2>${has ? 'تغيير رمز الدخول' : 'إنشاء رمز دخول'}</h2>
    ${has ? '<label class="f" for="pOld">الرمز الحالي</label><input class="pin" id="pOld" type="password" inputmode="numeric" maxlength="8">' : ''}
    <label class="f" for="pNew">الرمز الجديد (4–8 أرقام)</label><input class="pin" id="pNew" type="password" inputmode="numeric" maxlength="8">
    <label class="f" for="pNew2">تأكيد الرمز</label><input class="pin" id="pNew2" type="password" inputmode="numeric" maxlength="8">
    <div class="stack" style="margin-top:12px"><button class="btn primary" data-act="ok">حفظ</button>${has ? '<button class="btn danger" data-act="remove">إزالة رمز الدخول</button>' : ''}<button class="btn" data-act="closeSheet">إلغاء</button></div>`, {
      async ok(){ if (has && await hashPin($('#pOld').value.trim()) !== S.settings.pinHash) return toast('الرمز الحالي غير صحيح');
        const a = $('#pNew').value.trim(), b = $('#pNew2').value.trim();
        if (!/^\d{4,8}$/.test(a)) return toast('الرمز من 4 إلى 8 أرقام'); if (a !== b) return toast('الرمزان غير متطابقين');
        S.settings.pinHash = await hashPin(a); save(); closeSheet(); render(); toast('حُفظ رمز الدخول'); },
      async remove(){ if (await hashPin($('#pOld').value.trim()) !== S.settings.pinHash) return toast('اكتب الرمز الحالي أولًا'); S.settings.pinHash = null; save(); closeSheet(); render(); toast('أُزيل رمز الدخول'); },
    });
}
Object.assign(actions, { logout(){ setSession(false); showWelcome(); }, pin(){ pinFlow(); } });

/* ============ تشغيل ============ */
function net(){ const on = navigator.onLine; $('#netDot').classList.toggle('off', !on); $('#netTxt').textContent = on ? 'يعمل محليًا' : 'دون إنترنت'; }
addEventListener('online', net); addEventListener('offline', net);
{ const st = document.createElement('style'); st.textContent = REPORT_CSS; document.head.appendChild(st); }
load(); net(); { const aj = active(); if (aj && !summarize(aj).paused) Steps.start(aj); } if (sessionOK()) render(); else showWelcome();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__sanad = {Steps, stepCoverage, get S(){ return S; }, summarize, handleScan, actions, journeyRow, insights, inRange, predict};
</script>
